name: Build and Release Xenos

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-2019
    strategy:
      matrix:
        configuration: [Release]
        platform: [Win32, x64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Project
        run: |
          msbuild Xenos.sln `
          /p:Configuration=${{ matrix.configuration }} `
          /p:Platform=${{ matrix.platform }} `
          /p:CL_MPCount=4 `
          /p:CharacterSet=Unicode `
          /p:AdditionalCompilerOptions="/D_CRT_SECURE_NO_WARNINGS /Zc:strictStrings- /FIiterator /FImemory" `
          /m

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          $dir = "to_upload"
          if (!(Test-Path $dir)) { New-Item -ItemType Directory -Path $dir }
          Get-ChildItem -Path "build" -Recurse -Include *.exe, *.pdb | Copy-Item -Destination $dir
          if ((Get-ChildItem $dir).Count -eq 0) {
            Get-ChildItem -Recurse -Include Xenos*.exe, Xenos*.pdb | Where-Object { $_.FullName -like "*Release*" } | Copy-Item -Destination $dir
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Xenos-${{ matrix.platform }}
          path: to_upload/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Win32 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Xenos-Win32
          path: release_files/x86

      - name: Download x64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Xenos-x64
          path: release_files/x64

      - name: Create Zip
        run: |
          cd release_files
          zip -r ../Xenos_Full_Pack.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Xenos_Full_Pack.zip
          name: Xenos Release ${{ github.ref_name }}
          body: |
            Automated build for version ${{ github.ref_name }}
            Includes both x86 and x64 versions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
